name: nickname-sync
on:
  schedule:
    - cron: "0 4 * * *"  # 每天 04:00 UTC (12:00 北京时间)
  workflow_dispatch: {}  # 支持手动触发

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 处理昵称更新 issue 并合并进 nickname.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/nickname_sync_server.py
